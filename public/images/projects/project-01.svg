<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p1Grad)"/>
  
  <!-- Browser Frame Header -->
  <rect width="600" height="40" fill="#131D38"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="55" cy="20" r="5" fill="#10B981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#0B132B"/>
  <text x="300" y="24" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">telemetry.security-control.io/live</text>

  <!-- Left Sidebar -->
  <rect x="20" y="60" width="130" height="280" rx="10" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
  <rect x="35" y="80" width="100" height="18" rx="4" fill="rgba(0, 180, 216, 0.2)"/>
  <rect x="35" y="110" width="100" height="14" rx="3" fill="#1E293B"/>
  <rect x="35" y="135" width="100" height="14" rx="3" fill="#1E293B"/>
  <rect x="35" y="160" width="100" height="14" rx="3" fill="#1E293B"/>
  <rect x="35" y="185" width="100" height="14" rx="3" fill="#1E293B"/>

  <!-- Main Camera Matrix Grid -->
  <rect x="165" y="60" width="200" height="135" rx="8" fill="#0B132B" stroke="#00B4D8" stroke-width="1.5"/>
  <text x="180" y="85" fill="#00FFC2" font-family="monospace" font-size="11">CAM-01 [ACCESO PRINCIPAL]</text>
  <circle cx="345" cy="80" r="4" fill="#EF4444"/>
  <polyline points="185,165 220,135 255,150 290,120 345,160" fill="none" stroke="#00FFC2" stroke-width="2"/>

  <rect x="380" y="60" width="200" height="135" rx="8" fill="#0B132B" stroke="rgba(72, 202, 228, 0.3)"/>
  <text x="395" y="85" fill="#94A3B8" font-family="monospace" font-size="11">CAM-02 [CENTRO DE DATOS]</text>
  <circle cx="560" cy="80" r="4" fill="#10B981"/>

  <!-- Bottom Analytics Telemetry Stream -->
  <rect x="165" y="210" width="415" height="130" rx="10" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
  <text x="185" y="235" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Telemetría de Eventos en Tiempo Real (WebSockets)</text>
  
  <line x1="185" y1="290" x2="560" y2="290" stroke="#1E293B" stroke-width="1"/>
  <polyline points="190,300 230,270 270,285 310,250 350,265 390,240 430,280 470,255 510,245 550,260" fill="none" stroke="url(#p1Accent)" stroke-width="2.5"/>
  <circle cx="550" cy="260" r="4" fill="#00FFC2"/>
</svg>
