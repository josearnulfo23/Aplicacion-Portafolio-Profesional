<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p4Grad)"/>
  
  <!-- Browser Frame Header -->
  <rect width="600" height="40" fill="#131D38"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="55" cy="20" r="5" fill="#10B981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#0B132B"/>
  <text x="300" y="24" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">audit-framework.security.local</text>

  <!-- Central Risk Matrix & Shield -->
  <g transform="translate(40, 60)">
    <rect width="520" height="270" rx="12" fill="#131D38" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5"/>
    <text x="25" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Matriz Cuantitativa de Riesgos &amp; Vulnerabilidades</text>
    
    <!-- Matrix Grid -->
    <rect x="25" y="60" width="300" height="180" rx="8" fill="#0B132B" stroke="#1E293B"/>
    <!-- Heatmap Cells -->
    <rect x="40" y="75" width="45" height="40" rx="4" fill="rgba(239, 68, 68, 0.8)"/>
    <rect x="95" y="75" width="45" height="40" rx="4" fill="rgba(239, 68, 68, 0.6)"/>
    <rect x="150" y="75" width="45" height="40" rx="4" fill="rgba(245, 158, 11, 0.6)"/>
    <rect x="205" y="75" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.4)"/>
    <rect x="260" y="75" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.2)"/>

    <rect x="40" y="125" width="45" height="40" rx="4" fill="rgba(239, 68, 68, 0.6)"/>
    <rect x="95" y="125" width="45" height="40" rx="4" fill="rgba(245, 158, 11, 0.7)"/>
    <rect x="150" y="125" width="45" height="40" rx="4" fill="rgba(245, 158, 11, 0.4)"/>
    <rect x="205" y="125" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.4)"/>
    <rect x="260" y="125" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.2)"/>

    <rect x="40" y="175" width="45" height="40" rx="4" fill="rgba(245, 158, 11, 0.5)"/>
    <rect x="95" y="175" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.5)"/>
    <rect x="150" y="175" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.4)"/>
    <rect x="205" y="175" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <rect x="260" y="175" width="45" height="40" rx="4" fill="rgba(16, 185, 129, 0.1)"/>

    <!-- Right Shield Score -->
    <circle cx="430" cy="140" r="55" fill="rgba(0, 255, 194, 0.1)" stroke="#00FFC2" stroke-width="2"/>
    <text x="430" y="135" fill="#00FFC2" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">94%</text>
    <text x="430" y="155" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">CUMPLIMIENTO</text>
    <text x="430" y="215" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">84 Brechas Mitigadas</text>
  </g>
</svg>
