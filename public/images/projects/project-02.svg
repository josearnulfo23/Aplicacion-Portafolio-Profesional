<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="p2Accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2Grad)"/>
  
  <!-- Browser Frame Header -->
  <rect width="600" height="40" fill="#0B132B"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="55" cy="20" r="5" fill="#10B981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#1E293B"/>
  <text x="300" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">bi-analytics.corp.net/dashboard</text>

  <!-- 3 Top Metric Cards -->
  <g transform="translate(20, 55)">
    <rect width="175" height="75" rx="8" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
    <text x="15" y="25" fill="#94A3B8" font-family="sans-serif" font-size="10">VOLUMEN PROCESADO</text>
    <text x="15" y="55" fill="#00FFC2" font-family="sans-serif" font-size="20" font-weight="bold">524.8K</text>
    <text x="110" y="55" fill="#10B981" font-family="sans-serif" font-size="11">▲ +14%</text>
  </g>

  <g transform="translate(210, 55)">
    <rect width="175" height="75" rx="8" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
    <text x="15" y="25" fill="#94A3B8" font-family="sans-serif" font-size="10">EFICIENCIA DE PIPELINES</text>
    <text x="15" y="55" fill="#00B4D8" font-family="sans-serif" font-size="20" font-weight="bold">99.8%</text>
    <text x="120" y="55" fill="#10B981" font-family="sans-serif" font-size="11">▲ +2.4%</text>
  </g>

  <g transform="translate(400, 55)">
    <rect width="175" height="75" rx="8" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
    <text x="15" y="25" fill="#94A3B8" font-family="sans-serif" font-size="10">REDUCCIÓN DE COSTOS</text>
    <text x="15" y="55" fill="#F59E0B" font-family="sans-serif" font-size="20" font-weight="bold">-18.5%</text>
    <text x="120" y="55" fill="#00FFC2" font-family="sans-serif" font-size="11">★ META</text>
  </g>

  <!-- Big Data Visualization Chart -->
  <g transform="translate(20, 145)">
    <rect width="365" height="195" rx="10" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
    <text x="18" y="25" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Tendencia de Ingesta y Modelado ETL</text>
    
    <!-- Multi-layered Area/Bar chart -->
    <rect x="30" y="140" width="22" height="70" rx="3" fill="#0077B6"/>
    <rect x="65" y="110" width="22" height="100" rx="3" fill="#00B4D8"/>
    <rect x="100" y="80" width="22" height="130" rx="3" fill="#48CAE4"/>
    <rect x="135" y="60" width="22" height="150" rx="3" fill="#00FFC2"/>
    <rect x="170" y="90" width="22" height="120" rx="3" fill="#0077B6"/>
    <rect x="205" y="70" width="22" height="140" rx="3" fill="#00B4D8"/>
    <rect x="240" y="50" width="22" height="160" rx="3" fill="#48CAE4"/>
    <rect x="275" y="65" width="22" height="145" rx="3" fill="#00FFC2"/>
    <rect x="310" y="40" width="22" height="170" rx="3" fill="url(#p2Accent)"/>
  </g>

  <!-- Donut / Category Distribution Chart -->
  <g transform="translate(400, 145)">
    <rect width="175" height="195" rx="10" fill="#131D38" stroke="rgba(72, 202, 228, 0.2)"/>
    <text x="15" y="25" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Distribución ETL</text>
    <circle cx="87" cy="100" r="50" fill="none" stroke="#0077B6" stroke-width="16"/>
    <circle cx="87" cy="100" r="50" fill="none" stroke="#00B4D8" stroke-width="16" stroke-dasharray="140 314" stroke-dashoffset="-40"/>
    <circle cx="87" cy="100" r="50" fill="none" stroke="#00FFC2" stroke-width="16" stroke-dasharray="90 314" stroke-dashoffset="-180"/>
    <text x="87" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SQL/BI</text>
  </g>
</svg>
