<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#E0A96D"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#glowRing)" stroke-width="4" filter="url(#glowEffect)" opacity="0.8"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="rgba(72, 202, 228, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Avatar Base Circle -->
  <clipPath id="avatarClip">
    <circle cx="200" cy="200" r="150"/>
  </clipPath>

  <g clip-path="url(#avatarClip)">
    <!-- Backdrop inside avatar -->
    <rect x="50" y="50" width="300" height="300" fill="#131D38"/>
    <circle cx="200" cy="170" r="110" fill="rgba(0, 180, 216, 0.1)"/>
    
    <!-- Body / Suit -->
    <path d="M110 370 C110 290 145 270 200 270 C255 270 290 290 290 370 Z" fill="url(#suitGrad)"/>
    <polygon points="175,270 200,320 225,270" fill="#FFFFFF"/>
    <polygon points="195,290 200,350 205,290" fill="#00B4D8"/>
    <!-- Jacket lapels -->
    <polygon points="120,370 170,275 190,340 140,370" fill="#293548"/>
    <polygon points="280,370 230,275 210,340 260,370" fill="#293548"/>

    <!-- Neck -->
    <rect x="182" y="220" width="36" height="60" rx="8" fill="url(#skinGrad)"/>

    <!-- Head / Face -->
    <path d="M150 170 C150 120 170 110 200 110 C230 110 250 120 250 170 C250 220 230 240 200 240 C170 240 150 220 150 170 Z" fill="url(#skinGrad)"/>

    <!-- Hair -->
    <path d="M146 150 C144 110 165 92 200 92 C235 92 256 110 254 150 C242 120 230 115 200 115 C170 115 158 120 146 150 Z" fill="#1E293B"/>

    <!-- Eyes & Brows -->
    <path d="M168 152 Q178 148 188 152" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M212 152 Q222 148 232 152" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="178" cy="162" r="4.5" fill="#0F172A"/>
    <circle cx="222" cy="162" r="4.5" fill="#0F172A"/>
    <circle cx="179" cy="160" r="1.5" fill="#FFFFFF"/>
    <circle cx="223" cy="160" r="1.5" fill="#FFFFFF"/>

    <!-- Glasses Frame (Modern Executive) -->
    <rect x="163" y="152" width="30" height="20" rx="4" fill="none" stroke="#00B4D8" stroke-width="2.5"/>
    <rect x="207" y="152" width="30" height="20" rx="4" fill="none" stroke="#00B4D8" stroke-width="2.5"/>
    <line x1="193" y1="160" x2="207" y2="160" stroke="#00B4D8" stroke-width="2.5"/>

    <!-- Nose & Smile -->
    <path d="M197 172 Q200 182 203 182" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M182 202 Q200 215 218 202" stroke="#B45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- High-tech Floating Badges -->
  <g transform="translate(45, 290)">
    <rect width="80" height="28" rx="14" fill="rgba(11, 19, 43, 0.9)" stroke="#00FFC2" stroke-width="1.5"/>
    <text x="40" y="18" fill="#00FFC2" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TI &amp; Datos</text>
  </g>

  <g transform="translate(275, 290)">
    <rect width="80" height="28" rx="14" fill="rgba(11, 19, 43, 0.9)" stroke="#00B4D8" stroke-width="1.5"/>
    <text x="40" y="18" fill="#00B4D8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Seguridad</text>
  </g>
</svg>
