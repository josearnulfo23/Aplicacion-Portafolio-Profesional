<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(28, 37, 65, 0.95)"/>
      <stop offset="100%" stop-color="rgba(11, 19, 43, 0.95)"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Background Grid & Glows -->
  <circle cx="250" cy="200" r="140" fill="rgba(0, 180, 216, 0.08)"/>
  <circle cx="380" cy="120" r="90" fill="rgba(0, 255, 194, 0.06)"/>

  <!-- Card 1: Data Analytics & Chart (Top Right) -->
  <g transform="translate(240, 40)">
    <rect width="220" height="150" rx="16" fill="url(#cardGrad1)" stroke="rgba(72, 202, 228, 0.4)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="bold">Pipeline Analítico ETL</text>
    <!-- Bar Chart -->
    <rect x="25" y="100" width="18" height="30" rx="3" fill="#0077B6"/>
    <rect x="55" y="75" width="18" height="55" rx="3" fill="#00B4D8"/>
    <rect x="85" y="55" width="18" height="75" rx="3" fill="#00FFC2"/>
    <rect x="115" y="85" width="18" height="45" rx="3" fill="#48CAE4"/>
    <rect x="145" y="45" width="18" height="85" rx="3" fill="url(#blueGlow)"/>
    <!-- Line overlay -->
    <polyline points="34,95 64,70 94,50 124,80 154,40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="154" cy="40" r="4" fill="#00FFC2"/>
  </g>

  <!-- Card 2: Security & Telemetry (Bottom Right) -->
  <g transform="translate(200, 210)">
    <rect width="260" height="150" rx="16" fill="url(#cardGrad1)" stroke="rgba(0, 255, 194, 0.4)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="bold">Centro de Control &amp; Seguridad</text>
    <circle cx="50" cy="85" r="28" fill="rgba(0, 180, 216, 0.2)" stroke="#00B4D8" stroke-width="2"/>
    <path d="M50 70 L60 75 V85 C60 92 50 97 50 97 C50 97 40 92 40 85 V75 Z" fill="#00FFC2"/>
    <text x="95" y="75" fill="#48CAE4" font-family="sans-serif" font-size="12" font-weight="bold">Telemetría CCTV IP</text>
    <text x="95" y="95" fill="#94A3B8" font-family="sans-serif" font-size="11">Tiempo Respuesta: &lt; 3 min</text>
    <text x="95" y="115" fill="#00FFC2" font-family="sans-serif" font-size="11" font-weight="bold">99.9% Uptime</text>
  </g>

  <!-- Card 3: Software & Code Architecture (Left Main) -->
  <g transform="translate(30, 80)">
    <rect width="220" height="230" rx="16" fill="url(#cardGrad1)" stroke="rgba(72, 202, 228, 0.5)" stroke-width="2"/>
    <!-- Terminal Header -->
    <rect width="220" height="32" rx="16" fill="#1C2541"/>
    <circle cx="18" cy="16" r="4.5" fill="#EF4444"/>
    <circle cx="32" cy="16" r="4.5" fill="#F59E0B"/>
    <circle cx="46" cy="16" r="4.5" fill="#10B981"/>
    <text x="65" y="20" fill="#94A3B8" font-family="monospace" font-size="10">architecture.config.js</text>
    
    <!-- Code text lines -->
    <text x="18" y="60" fill="#00B4D8" font-family="monospace" font-size="11">const <tspan fill="#FFFFFF">cespedesProfile</tspan> = {</text>
    <text x="28" y="82" fill="#94A3B8" font-family="monospace" font-size="10">disciplines: [</text>
    <text x="38" y="102" fill="#00FFC2" font-family="monospace" font-size="10">'Software Engineering',</text>
    <text x="38" y="122" fill="#00FFC2" font-family="monospace" font-size="10">'Data Intelligence',</text>
    <text x="38" y="142" fill="#00FFC2" font-family="monospace" font-size="10">'Critical Security'</text>
    <text x="28" y="162" fill="#94A3B8" font-family="monospace" font-size="10">],</text>
    <text x="28" y="182" fill="#F59E0B" font-family="monospace" font-size="10">dataDriven: <tspan fill="#00FFC2">true</tspan>,</text>
    <text x="28" y="202" fill="#F59E0B" font-family="monospace" font-size="10">excellence: <tspan fill="#00FFC2">100</tspan></text>
    <text x="18" y="222" fill="#00B4D8" font-family="monospace" font-size="11">};</text>
  </g>
</svg>
